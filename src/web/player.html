<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Матч-центр</title>
<link rel="icon" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* полоска с названием и кнопками появляется, когда мышь у верхнего края */
  .bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 18px; color: #fff; background: linear-gradient(rgba(0,0,0,.75), transparent);
    opacity: 0; transition: opacity .2s; }
  .bar:hover, .bar:focus-within { opacity: 1; }
  .bar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar a { color: #9cc0ff; text-decoration: none; white-space: nowrap; }
  .bar button { border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.35); color: #fff; border-radius: 7px;
    padding: 3px 9px; font: inherit; cursor: pointer; white-space: nowrap; }
  .bar button[aria-pressed="true"] { background: #1f6fff; border-color: #1f6fff; }
  .error { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; }
</style>
</head>
<body>
<div class="bar">
  <b id="title"></b>
  <a id="ext" target="_blank" rel="noopener">Открыть в VK ↗</a>
  <button id="pin" type="button" hidden title="Окно поверх остальных">Поверх окон</button>
</div>
<script src="player.js"></script>
</body>
</html>
