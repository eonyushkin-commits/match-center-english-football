<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Матч-центр | Английский футбол</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="bar">
      <div class="brand">
        <img src="icon.png" alt="" width="28" height="28">
        <div><b>Матч-центр</b><small>Английский футбол</small></div>
      </div>
      <button class="status" id="status" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span class="dot" aria-hidden="true"></span><span id="status-text">VK</span>
      </button>
      <button class="icon-btn" id="refresh" type="button" title="Обновить (R)" aria-label="Обновить">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="theme" type="button" title="Тема" aria-label="Тема">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
      </button>
      <button class="icon-btn" id="open-settings" type="button" title="Настройки (,)" aria-label="Настройки">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
    <nav class="dates" id="dates" aria-label="Дата"></nav>
    <div class="filters">
      <button class="chip" type="button" data-filter="streams">С трансляцией</button>
      <button class="chip" type="button" data-filter="live">Идут сейчас</button>
      <button class="chip" type="button" data-filter="favorites">★ Избранное</button>
      <button class="chip" type="button" id="spoilers" title="Скрыть счёт и события — чтобы смотреть записи, не зная результата">Без спойлеров</button>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
        <input id="q" type="search" placeholder="Команда или турнир" aria-label="Поиск" autocomplete="off">
      </label>
    </div>
  </header>
  <div id="notices" aria-live="polite"></div>
  <main id="list" aria-busy="true"><div class="empty" data-key="loading">Загрузка…</div></main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="popover" id="status-pop" role="dialog" aria-label="Каналы VK" hidden></div>
<dialog id="settings" aria-label="Настройки"></dialog>
<script src="app.js"></script>
</body>
</html>
